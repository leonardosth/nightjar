name: Tizen TV (Frame Warp)

on:
  push:
    branches: [tizen, main]
    paths:
      - 'tizen/**'
      - '.github/workflows/tizen.yml'
  pull_request:
    paths:
      - 'tizen/**'

jobs:
  test-frame-warp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run JS Frame Warp v1, WASM runtime & TV input tests
        run: node --test tizen/tests/frame-warp.test.mjs tizen/tests/tv-runtime-and-input.test.mjs

      - name: Check documentation links
        run: node scripts/check-doc-links.mjs

      - name: Build & run C++17 Frame Warp unit tests (ASan + UBSan)
        run: |
          cmake -S tizen/wasm -B tizen/wasm/build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build tizen/wasm/build
          ctest --test-dir tizen/wasm/build --output-on-failure

  build-tizen-wasm:
    runs-on: ubuntu-latest
    needs: test-frame-warp
    steps:
      - uses: actions/checkout@v4

      - name: Compile Samsung Tizen WASM binary
        id: build_wasm
        run: |
          set -o pipefail
          mkdir -p tizen/app/wasm
          docker build --progress=plain -f tizen/Dockerfile -t nightjar-tizen-wasm . 2>&1 | tee docker-build.log
          docker run --rm -v "${{ github.workspace }}/tizen/app/wasm:/out" nightjar-tizen-wasm

      - name: Publish Docker build error summary on failure
        if: failure()
        run: |
          echo "### Docker WASM Build Failure Tail" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 docker-build.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Docker build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-failure-log
          path: docker-build.log

      - name: Upload compiled WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightjar-tizen-wasm
          path: tizen/app/wasm/
